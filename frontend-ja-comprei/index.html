<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Cache Control: Garante que o index.html seja validado a cada carregamento -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Já Comprei — receitas com o que você comprou</title>
  <meta name="description" content="Transforme sua nota fiscal em receitas para fazer hoje com o Já Comprei." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Já comprou. Agora sabe o que cozinhar." />
  <meta property="og:description" content="Envie a nota, confira os ingredientes e encontre receitas com o que já entrou na sua cozinha." />
  <meta property="og:image" content="https://app.jacomprei.app/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Já comprou. Agora sabe o que cozinhar." />
  <meta name="twitter:description" content="Transforme sua nota fiscal em receitas para fazer hoje." />
  <meta name="twitter:image" content="https://app.jacomprei.app/og.png" />
  <!-- Decide o tema ANTES da primeira pintura — evita o flash de claro→escuro
       no carregamento (o useTheme hook só roda depois do React montar). -->
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>

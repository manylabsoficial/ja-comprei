<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Cache Control: Garante que o index.html seja validado a cada carregamento -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Já Comprei</title>
  <!-- Decide o tema ANTES da primeira pintura — evita o flash de claro→escuro
       no carregamento (o useTheme hook só roda depois do React montar). -->
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
